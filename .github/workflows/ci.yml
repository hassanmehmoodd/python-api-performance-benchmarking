name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint, test, smoke benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Pytest
        run: python -m pytest

      - name: Start demo API
        run: |
          uvicorn demo_api.app:app --host 127.0.0.1 --port 8000 --no-access-log > /tmp/demo-api.log 2>&1 &
          echo $! > /tmp/demo-api.pid
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 0.25
          done
          echo "demo API failed to start" >&2
          cat /tmp/demo-api.log >&2
          exit 1

      - name: Smoke benchmark
        env:
          MPLBACKEND: Agg
        run: >
          python -m bench run
          --scenario scenarios/smoke.yaml
          --output-dir results/ci

      - name: Validate smoke outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("results/ci")
          required = ["summary.json", "summary.csv", "report.md", "report.html"]
          missing = [name for name in required if not (root / name).is_file() or (root / name).stat().st_size == 0]
          if missing:
              raise SystemExit(f"missing or empty outputs: {missing}")
          charts = list((root / "charts").glob("*.png"))
          if not charts:
              raise SystemExit("no chart pngs were written")
          for chart in charts:
              if chart.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise SystemExit(f"{chart} is not a png")
          payload = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          summaries = payload.get("summaries") or []
          if not any(item.get("successes", 0) > 0 for item in summaries):
              raise SystemExit("smoke run recorded no successes")
          print(f"smoke outputs ok: {len(summaries)} rows, {len(charts)} charts")
          PY

      - name: Upload smoke report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: results/ci/
          if-no-files-found: error
          retention-days: 14
