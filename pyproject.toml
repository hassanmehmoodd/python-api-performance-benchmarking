[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "api-performance-benchmark"
version = "1.0.0"
description = "Async API performance benchmarking for services you own or are authorized to test."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hassan Mehmood" }]
keywords = [
    "api",
    "benchmark",
    "asyncio",
    "fastapi",
    "httpx",
    "performance-testing",
    "qa-automation",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "pandas>=2.2",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[project.scripts]
bench = "bench.cli:main"
demo-api = "demo_api.main:main"

[project.urls]
Homepage = "https://github.com/hassanmehmoodd/python-api-performance-benchmarking"
Repository = "https://github.com/hassanmehmoodd/python-api-performance-benchmarking"

[tool.setuptools.packages.find]
include = ["bench*", "demo_api*"]

[tool.setuptools.package-data]
bench = ["py.typed"]
demo_api = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["bench", "demo_api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"demo_api/app.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["bench", "demo_api", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
